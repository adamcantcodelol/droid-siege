name = "droid-siege"
main = "src/worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws", "/relay", "/health"]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayHub"]
